<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liste de courses — Soirée 28-29 nov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background:#fafaf7;
    color:#1f1f1f;
    font-family:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    max-width:600px;
    margin:0 auto;
    padding:18px 16px 40px;
  }
  h1 {
    font-family:"Lora",Georgia,serif;
    font-size:24px; font-weight:700; letter-spacing:-0.3px;
  }
  .sub { font-size:13px; color:#8a8a80; margin:2px 0 14px; }
  .progress-wrap { margin-bottom:18px; }
  .progress {
    height:10px; background:#e9e4d6; border-radius:99px; overflow:hidden;
  }
  .progress-fill {
    height:100%; width:0%;
    background:linear-gradient(90deg,#c8a45c,#a8873e);
    border-radius:99px; transition:width .25s ease;
  }
  .progress-label { font-size:13px; color:#6f6a5a; font-weight:600; margin-top:5px; }
  .cat {
    background:#fff;
    border:1px solid #ece7da;
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:12px;
  }
  .cat h2 {
    display:flex; align-items:center; justify-content:space-between;
    font-size:16px; font-weight:700;
    border-left:4px solid #c8a45c;
    padding-left:10px; margin-bottom:8px;
  }
  .cat-count {
    font-size:12px; font-weight:600; color:#c8a45c;
    background:#f4efe2; border-radius:99px; padding:2px 9px;
  }
  .item {
    display:flex; align-items:center; gap:10px;
    padding:9px 4px;
    border-bottom:1px dashed #ece7da;
    cursor:pointer;
    -webkit-user-select:none; user-select:none;
  }
  .item:last-child { border-bottom:none; }
  .item input[type=checkbox] {
    appearance:none; -webkit-appearance:none;
    width:20px; height:20px; flex:0 0 20px;
    border:2px solid #c8a45c; border-radius:6px;
    cursor:pointer; position:relative; background:#fff;
    transition:background .15s;
  }
  .item input[type=checkbox]:checked {
    background:#c8a45c;
  }
  .item input[type=checkbox]:checked::after {
    content:""; position:absolute; left:5px; top:1px;
    width:5px; height:11px;
    border:solid #fff; border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  .item .name { flex:1; font-size:15px; line-height:1.25; }
  .item .qty { font-size:13px; font-weight:600; color:#8a8a80; white-space:nowrap; }
  .item input[type=checkbox]:checked ~ .name {
    text-decoration:line-through; color:#b5b1a5;
  }
  footer { margin-top:16px; }
  .note {
    font-size:12.5px; color:#a05a2c; font-style:italic;
    background:#fbf3ea; border:1px solid #f0dcc3; border-radius:8px;
    padding:10px 12px; margin-bottom:14px;
  }
  button {
    width:100%; padding:13px; font-size:15px; font-weight:600;
    font-family:inherit; color:#8a6d2f;
    background:#f4efe2; border:1px solid #d9cba3; border-radius:10px;
    cursor:pointer;
  }
  button:active { background:#ece4cf; }
</style>
</head>
<body>
  <h1>📋 Liste de courses</h1>
  <div class="sub">Soirée 28-29 nov · coche au fur et à mesure</div>

  <div class="progress-wrap">
    <div class="progress"><div class="progress-fill" id="bar"></div></div>
    <div class="progress-label" id="plabel">0 / 0 · 0%</div>
  </div>

  <main id="list"></main>

  <footer>
    <div class="note">⚠️ Micro MAX9814 : ton plan disait 1, mais la synchro « double écoute » en veut 2 → j'ai mis 2.</div>
    <button id="reset" type="button">Tout décocher</button>
  </footer>

<script>
;(function(){
  var CATS = [
    { emoji:'🍹', name:'Fontaine à punch (cocktails)', items:[
      ['Fontaine à punch 5 L','× 1'],
      ['Jus de fruits (ananas, multi, orange)','30 L'],
      ['Fruits frais punch (ananas, citrons verts)','1 lot'],
      ['Rhum blanc (rhum arrangé)','1 L'],
      ['Fruits rhum arrangé (ananas, mangue, gingembre)','1 lot'],
      ['Sucre de canne','300 g'],
      ['Pichets en verre','× 3'],
      ['Doseurs + shaker','× 1'],
      ['Verres long drink 270 ml (Action)','84 pcs']
    ]},
    { emoji:'🔦', name:'Système lasers', items:[
      ['Lasers verts 5mW 532nm 5V','20 (+2)'],
      ['Servos SG90 9g','40 (+2)'],
      ['Embouts diffraction étoile','× 20'],
      ['ESP32','× 1'],
      ['PCA9685 16 canaux','× 3'],
      ['Alimentation 5V 10A','× 1'],
      ['Câbles dupont','1 lot']
    ]},
    { emoji:'🥃', name:'Planche à shot', items:[
      ['Verres à shot','× 30'],
      ['Planches à shot (bois + LED, DIY)','× 1'],
      ['Micro MAX9814 (synchro son)','× 2']
    ]},
    { emoji:'🌫️', name:'Ambiance (fumée + déco + buffet)', items:[
      ['Machine à fumée BeamZ S500','× 1'],
      ['Liquide à fumée 1 L','× 1'],
      ['Franges métalliques (6 pièces 1×2m)','3 packs'],
      ['Nappes élégantes','× 2'],
      ['Tréteaux + planche (buffet DIY)','× 1']
    ]},
    { emoji:'🧊', name:'Bar & glace', items:[
      ['Seaux à glace métal','× 2'],
      ['Grand bac à bouteilles / glacière','× 1'],
      ['Glaçons','10 sacs'],
      ['Citrons + menthe','1 lot']
    ]},
    { emoji:'🍕', name:'Nourriture', items:[
      ['Pizzas surgelées','× 30'],
      ['Chips / olives / cacahuètes / saucisson','~6 kg']
    ]},
    { emoji:'🥤', name:'Boissons & mixers', items:[
      ['Cola 1,75 L','70 btl'],
      ['Alcool fort (vodka/rhum/whisky)','18 btl']
    ]},
    { emoji:'🧻', name:'Vaisselle & divers', items:[
      ['Gobelets, pailles, assiettes','1 lot'],
      ['Sacs poubelle','1 lot']
    ]}
  ];

  var STORAGE_KEY = 'liste-courses-soiree-v1';
  var list = document.getElementById('list');
  var bar = document.getElementById('bar');
  var plabel = document.getElementById('plabel');

  var state = {};
  try { state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e){ state = {}; }

  CATS.forEach(function(cat, ci){
    var sec = document.createElement('section');
    sec.className = 'cat';
    var h = document.createElement('h2');
    h.textContent = cat.emoji + ' ' + cat.name;
    var cnt = document.createElement('span');
    cnt.className = 'cat-count';
    h.appendChild(cnt);
    sec.appendChild(h);
    cat.items.forEach(function(it, ii){
      var id = ci + '-' + ii;
      var lab = document.createElement('label');
      lab.className = 'item';
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.setAttribute('data-id', id);
      if (state[id]) { cb.checked = true; }
      cb.addEventListener('change', function(){ save(); update(); });
      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = it[0];
      var qty = document.createElement('span');
      qty.className = 'qty';
      qty.textContent = it[1];
      lab.appendChild(cb);
      lab.appendChild(name);
      lab.appendChild(qty);
      sec.appendChild(lab);
    });
    list.appendChild(sec);
  });

  function save(){
    var s = {};
    var all = document.querySelectorAll('input[type=checkbox]');
    for (var i=0; i<all.length; i++){
      s[all[i].getAttribute('data-id')] = all[i].checked;
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  }

  function update(){
    var all = document.querySelectorAll('input[type=checkbox]');
    var done = 0;
    for (var i=0; i<all.length; i++){ if (all[i].checked) done++; }
    var pct = all.length ? Math.round(done/all.length*100) : 0;
    bar.style.width = pct + '%';
    plabel.textContent = done + ' / ' + all.length + ' · ' + pct + '%';
    var secs = document.querySelectorAll('.cat');
    for (var s=0; s<secs.length; s++){
      var cbs = secs[s].querySelectorAll('input[type=checkbox]');
      var d = 0;
      for (var c=0; c<cbs.length; c++){ if (cbs[c].checked) d++; }
      var cc = secs[s].querySelector('.cat-count');
      if (cc) cc.textContent = d + '/' + cbs.length;
    }
  }

  document.getElementById('reset').addEventListener('click', function(){
    if (!confirm('Tout décocher ?')) return;
    var all = document.querySelectorAll('input[type=checkbox]');
    for (var i=0; i<all.length; i++){ all[i].checked = false; }
    save(); update();
  });

  update();
})();
</script>
</body>
</html>
